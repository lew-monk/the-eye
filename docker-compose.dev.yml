version: "3.8"

services:
  # Infrastructure
  postgres:
    restart: always
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: legal_docs
      POSTGRES_USER: legal_user
      POSTGRES_PASSWORD: legal_pass
    volumes:
      - postgres_data_vec:/var/lib/postgresql/data
      - ./packages/shared/src/migrations/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_user -d legal_docs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - the-eye-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - the-eye-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - the-eye-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET:-the-eye-documents};
      mc anonymous set none local/$${S3_BUCKET:-the-eye-documents};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-the-eye-documents}
    networks:
      - the-eye-network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    env_file:
      - ./.env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - the-eye-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  # Development services with hot reload
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web-dev
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - API_URL=http://api:3001
      - COREF_SERVICE_TOKEN=${COREF_SERVICE_TOKEN}
      - API_SERVICE_TOKEN=${COREF_SERVICE_TOKEN}
    volumes:
      - .:/app
      - /app/apps/eye-web-app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/core/node_modules
      - /app/packages/workers/node_modules
    depends_on:
      - api
    working_dir: /app
    networks:
      - the-eye-network
    command: sh -c "cd apps/eye-web-app && bun install && bun run dev --host 0.0.0.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api-dev
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    environment:
      - OCR_WORKER_CONCURRENCY=${OCR_WORKER_CONCURRENCY:-2}
      - PDF_EXTRACTOR=${PDF_EXTRACTOR:-azure}
      - PDF_EXTRACT_FALLBACK=${PDF_EXTRACT_FALLBACK:-azure}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-the-eye-documents}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/core/node_modules
      - /app/packages/workers/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    working_dir: /app
    networks:
      - the-eye-network
    command: sh -c "bun install && bun run watch:packages & cd apps/api && bun run dev"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  coreference-worker:
    build:
      context: ./packages/coreference-worker
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    environment:
      - COREF_MODEL_ARCHITECTURE=${COREF_MODEL_ARCHITECTURE:-FCoref}
    volumes:
      - ./packages/coreference-worker/src:/app/src
      - ./packages/coreference-worker/patterns.yaml:/app/patterns.yaml
      - ./packages/coreference-worker/titles.yaml:/app/titles.yaml
      - ./packages/coreference-worker/weights.yaml:/app/weights.yaml
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - the-eye-network
    command: watchfiles "python -m src.worker" /app/src
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

volumes:
  postgres_data_vec:
  huggingface_cache:
  minio_data:

networks:
  the-eye-network:
    driver: bridge
